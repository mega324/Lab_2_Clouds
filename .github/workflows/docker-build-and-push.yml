name: Test, Build and Push Docker Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
  REPO_NAME: cloudcs-lab2

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=./src_loan MODEL_PATH=./models/pipeline.pkl python -m pytest test_loan -v

  push-image-to-docker-hub:
    name: Build and push images
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Build and push Keycloak image
        run: |
          docker build ./keycloak/docker --tag $DOCKER_USER/$REPO_NAME:keycloak
          docker push $DOCKER_USER/$REPO_NAME:keycloak

      - name: Build and push Inference Service image
        run: |
          docker build . --file docker/Dockerfile --tag $DOCKER_USER/$REPO_NAME:inference-service
          docker push $DOCKER_USER/$REPO_NAME:inference-service
